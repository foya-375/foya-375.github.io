# .github/workflows/hugo-deploy.yml
name: 部署 Hugo 网站到 GitHub Pages

on:
  # 当推送到默认分支（通常是 main 或 master）时触发
  push:
    branches:
      - main
      - master    # 如果你还用 master，保留这一行

  # 允许手动触发
  workflow_dispatch:

# 设置 GitHub Token 权限，允许部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 保证只有一个部署任务运行，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0   # 建议使用最新 Extended 版本

    steps:
      - name: 安装 Hugo（Extended 版本）
        run: |
          wget -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: 安装 Dart Sass（Hugo Extended 需要）
        run: sudo snap install dart-sass

      - name: 检出代码（包括子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0     # 完整历史，对某些 Hugo 功能有用

      - name: 设置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 安装 Node.js 依赖（如果项目有 package.json）
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci
          fi

      - name: 构建 Hugo 网站
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物（供 Pages 部署使用）
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
